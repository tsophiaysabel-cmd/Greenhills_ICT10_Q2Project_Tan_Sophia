<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Non-Metals Element Search</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #e5defa 0%, #f5f2fe 68%, #d2ebd6 68%, #bce0c2 100%);
            color: #282438;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }

        /* Top navigation bar */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 34px;
        }

        nav a {
            text-decoration: none;
            color: #282438;
            background-color: #fffef9;
            border: 2px solid #282438;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            box-shadow: 3px 3px 0px #282438;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        nav a:hover {
            transform: translate(-1px, -1px);
            background-color: #ece6fc;
        }

        nav a.active {
            background-color: #c5b6f5;
            color: #1f1b2e;
        }

        /* Main window card */
        .container {
            width: 100%;
            max-width: 520px;
            background-color: #fffef9;
            border: 2.5px solid #282438;
            border-radius: 14px;
            box-shadow: 7px 7px 0px #282438;
            overflow: hidden;
        }

        .window-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background-color: #dad0fa;
            border-bottom: 2px solid #282438;
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.8px solid #282438;
        }

        .dot.lilac { background-color: #c5b6f5; }
        .dot.lemon { background-color: #fce588; }
        .dot.meadow { background-color: #b7e3c0; }

        .chip {
            background-color: #e6f7ea;
            color: #1f4d29;
            border: 1.5px solid #282438;
            border-radius: 999px;
            padding: 3px 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .card-body {
            padding: 26px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.65rem;
            text-align: center;
            color: #231f33;
        }

        .desc {
            margin: 0 0 20px;
            font-size: 0.95rem;
            text-align: center;
            color: #5a5473;
        }

        /* Stacked search layout */
        .search-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            color: #231f33;
            background-color: #f8f6fe;
            border: 2px solid #282438;
            border-radius: 10px;
            outline: none;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(197, 182, 245, 0.5);
        }

        button {
            width: 100%;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #1f1b2e;
            background-color: #c5b6f5;
            border: 2px solid #282438;
            border-radius: 10px;
            box-shadow: 3px 3px 0px #282438;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        button:hover {
            background-color: #b3a1f0;
            transform: translate(-1px, -1px);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #282438;
        }

        /* Dedicated box for PyScript output */
        .output-box {
            margin-top: 22px;
            padding: 16px 18px;
            background-color: #f3effd;
            border: 2px solid #282438;
            border-radius: 12px;
            box-shadow: 4px 4px 0px #282438;
            min-height: 92px;
        }

        .output-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #655e82;
            margin-bottom: 6px;
        }

        #result {
            margin: 0 0 6px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #231f33;
        }

        #information {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #46405e;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Homepage</a>
        <a href="skills_test.html" class="active">Element Checker</a>
        <a href="Pa_2.html">School Club Members</a>
        <a href="Meetda_creator.html">Meet the Creator</a>
    </nav>

    <div class="container">
        <div class="window-bar">
            <div class="dots">
                <span class="dot lilac"></span>
                <span class="dot lemon"></span>
                <span class="dot meadow"></span>
            </div>
            <span class="chip">Non-Metals Lab</span>
        </div>

        <div class="card-body">
            <h1>Non-Metals Element Search</h1>
            <p class="desc">Enter an element symbol to search:</p>

            <div class="search-stack">
                <input type="text" id="symbol" placeholder="Example: H, O, Cl">
                <button py-click="search_element">Search</button>
            </div>

            <!-- Box where PyScript displays #result and #information -->
            <div class="output-box">
                <span class="output-label">Element Result</span>
                <h3 id="result"></h3>
                <p id="information"></p>
            </div>
        </div>
    </div>

    <script type="py" src="main2.py"></script>
</body>
</html>
