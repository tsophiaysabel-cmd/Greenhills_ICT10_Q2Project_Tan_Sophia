<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Nickname Explorer</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f9d8e2 0%, #fceef3 68%, #c9e2b3 68%, #b6d69c 100%);
            color: #3b2d32;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }

        /* Top navigation bar */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
        }

        nav a {
            text-decoration: none;
            color: #3b2d32;
            background-color: #fffdf5;
            border: 2px solid #3b2d32;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            box-shadow: 3px 3px 0px #3b2d32;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        nav a:hover {
            transform: translate(-1px, -1px);
            background-color: #ffe8ef;
        }

        nav a.active {
            background-color: #f7a8be;
            color: #2b1d22;
        }

        /* Centered retro window card */
        .container {
            width: 100%;
            max-width: 520px;
            background-color: #fffdf5;
            border: 2.5px solid #3b2d32;
            border-radius: 14px;
            box-shadow: 7px 7px 0px #3b2d32;
            overflow: hidden;
        }

        .window-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background-color: #ffd6e3;
            border-bottom: 2px solid #3b2d32;
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.8px solid #3b2d32;
        }

        .dot.pink { background-color: #ff9ebb; }
        .dot.yellow { background-color: #ffe28a; }
        .dot.green { background-color: #bce3a1; }

        .badge {
            display: inline-block;
            background-color: #e8f5dc;
            color: #2f5223;
            border: 1.5px solid #3b2d32;
            border-radius: 999px;
            padding: 3px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .card-body {
            padding: 28px 26px;
            text-align: center;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: 1.75rem;
            color: #2f2227;
        }

        .subtitle {
            margin: 0 0 24px;
            font-size: 0.96rem;
            color: #6b565e;
            line-height: 1.45;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #3b2d32;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.98rem;
            font-family: inherit;
            color: #2f2227;
            background-color: #fff8fa;
            border: 2px solid #3b2d32;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(247, 168, 190, 0.45);
        }

        button {
            width: 100%;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #2b1d22;
            background-color: #f7a8be;
            border: 2px solid #3b2d32;
            border-radius: 10px;
            box-shadow: 3px 3px 0px #3b2d32;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        button:hover {
            background-color: #f48fab;
            transform: translate(-1px, -1px);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #3b2d32;
        }

        #result {
            margin: 20px 0 0;
            min-height: 52px;
            padding: 14px;
            background-color: #fff7fa;
            border: 2px dashed #c99aa9;
            border-radius: 10px;
            font-size: 1.02rem;
            font-weight: 700;
            color: #3b2d32;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Homepage</a>
        <a href="skills_test.html">Element Checker</a>
        <a href="Pa_2.html">School Club Members</a>
        <a href="Meetda_creator.html">Meet the Creator</a>
    </nav>

    <div class="container">
        <div class="window-bar">
            <div class="dots">
                <span class="dot pink"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="badge">South America</div>
        </div>

        <div class="card-body">
            <h1>Country Nickname Explorer</h1>
            <p class="subtitle">Choose a nation from the list below to discover its legendary title.</p>

            <div class="input-group">
                <label for="country">Select Country</label>
                <select id="country">
                    <option value="Argentina">Argentina</option>
                    <option value="Bolivia">Bolivia</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Chile">Chile</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Ecuador">Ecuador</option>
                    <option value="Guyana">Guyana</option>
                    <option value="Paraguay">Paraguay</option>
                    <option value="Peru">Peru</option>
                </select>
            </div>

            <button py-click="show_name">Show Nickname</button>

            <p id="result"></p>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
